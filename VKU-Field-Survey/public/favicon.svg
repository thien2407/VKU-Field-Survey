<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="vkuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021B3D"/>
      <stop offset="50%" stop-color="#002D62"/>
      <stop offset="100%" stop-color="#061326"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9248"/>
      <stop offset="100%" stop-color="#F37021"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#38BDF8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle border -->
  <rect width="512" height="512" rx="116" fill="url(#vkuGrad)"/>
  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Subtle radar / tech rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="2"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>

  <!-- Main Survey Clipboard Frame -->
  <g filter="url(#shadow)">
    <!-- Clipboard body -->
    <rect x="120" y="85" width="272" height="342" rx="32" fill="#FFFFFF"/>
    
    <!-- Top Clamp Header -->
    <rect x="196" y="66" width="120" height="42" rx="14" fill="url(#orangeGrad)"/>
    <circle cx="256" cy="87" r="7" fill="#FFFFFF"/>

    <!-- Survey Header Line inside clipboard -->
    <rect x="156" y="140" width="130" height="14" rx="7" fill="#002D62" fill-opacity="0.85"/>
    <rect x="296" y="140" width="60" height="14" rx="7" fill="url(#orangeGrad)" fill-opacity="0.9"/>

    <!-- Row 1: Green Checked Item -->
    <circle cx="176" cy="195" r="16" fill="url(#emeraldGrad)"/>
    <path d="M169 195 L174 200 L184 189" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="206" y="188" width="150" height="13" rx="6.5" fill="#002D62" fill-opacity="0.7"/>

    <!-- Row 2: GPS Location item -->
    <circle cx="176" cy="255" r="16" fill="url(#cyanGrad)"/>
    <!-- Pin icon inside circle -->
    <circle cx="176" cy="252" r="5" fill="#FFFFFF"/>
    <path d="M176 257 L176 264" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="206" y="248" width="125" height="13" rx="6.5" fill="#002D62" fill-opacity="0.6"/>

    <!-- Row 3: Camera photo item -->
    <circle cx="176" cy="315" r="16" fill="url(#orangeGrad)"/>
    <!-- Camera icon -->
    <rect x="168" y="309" width="16" height="12" rx="3" fill="#FFFFFF"/>
    <circle cx="176" cy="315" r="3.5" fill="url(#orangeGrad)"/>
    <rect x="206" y="308" width="140" height="13" rx="6.5" fill="#002D62" fill-opacity="0.5"/>

    <!-- Row 4: Progress / sync line -->
    <rect x="156" y="365" width="200" height="10" rx="5" fill="#E2E8F0"/>
    <rect x="156" y="365" width="145" height="10" rx="5" fill="url(#cyanGrad)"/>
  </g>

  <!-- High-tech satellite sync signal at bottom right -->
  <g transform="translate(370, 390)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="url(#emeraldGrad)"/>
    <!-- Signal wave / check -->
    <path d="M-10 0 L-3 7 L11 -7" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
